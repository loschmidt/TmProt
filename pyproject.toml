[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tmprot-predictor"
version = "0.1.0"
license = {file = "LICENSE"}
dependencies = [
    "omegaconf>=2.3",
    "torch>=2.5.1",
    "transformers>=4.47.1",
    "accelerate>=0.29.0",
    "pandas>=2.2.3",
    "datasets>=2.18.0",
    "peft==0.13.2",
    "scipy>=1.14.1",
    "scikit-learn",
    "seaborn",
    "matplotlib",
    "biopython",
    "joblib",
    "tqdm",
    "prettytable",
    "python-dotenv",
    "esm",
    "mlflow",
    "dagshub",
    "optuna",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
